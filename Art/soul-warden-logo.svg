<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="disc" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#2a1747"/>
      <stop offset="1" stop-color="#0d0818"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b78cff" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#7c4ddb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c4ddb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7a6ff"/>
      <stop offset="1" stop-color="#7448d0"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <circle cx="256" cy="256" r="244" fill="url(#disc)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ring)" stroke-width="12"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="#9e75ed" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Glow behind the shard -->
  <circle cx="256" cy="262" r="190" fill="url(#glow)"/>

  <!-- Soul shard: a long faceted crystal -->
  <g transform="translate(256 259) scale(1.1) translate(-256 -259)">
    <g stroke="#1a0b33" stroke-width="6" stroke-linejoin="round">
      <!-- upper facets -->
      <polygon points="256,78 186,186 256,214" fill="#d3b8ff"/>
      <polygon points="256,78 326,186 256,214" fill="#a77bf5"/>
      <!-- middle facets -->
      <polygon points="186,186 198,332 256,214" fill="#9563ea"/>
      <polygon points="326,186 314,332 256,214" fill="#6c3cc9"/>
      <polygon points="198,332 256,214 314,332 256,360" fill="#8150dc"/>
      <!-- lower facets -->
      <polygon points="198,332 256,440 256,360" fill="#6a3bc6"/>
      <polygon points="314,332 256,440 256,360" fill="#47228f"/>
    </g>

    <!-- Highlights -->
    <polygon points="244,108 206,180 226,188" fill="#ffffff" opacity="0.75"/>
    <polygon points="214,206 222,300 236,240" fill="#ffffff" opacity="0.28"/>

  </g>

  <!-- Sparkles -->
  <g fill="#e6d6ff">
    <path d="M372 140 L378 158 L396 164 L378 170 L372 188 L366 170 L348 164 L366 158 Z"/>
    <path d="M138 300 L142 312 L154 316 L142 320 L138 332 L134 320 L122 316 L134 312 Z" opacity="0.85"/>
    <path d="M360 372 L363 381 L372 384 L363 387 L360 396 L357 387 L348 384 L357 381 Z" opacity="0.7"/>
  </g>
</svg>
